# Host nginx — tools.datawork.top (production edge; no Docker nginx-proxy).
# TLS terminates here. Upstreams: 127.0.0.1 ports published by docker-compose.prd.yml.
#
# Install: infra/nginx/host-setup/05-install-prd-datawork-host-nginx.sh
# After DNS: certbot --nginx -d tools.datawork.top -d s3.datawork.top -d www.datawork.top --redirect

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Route /build/ and favicon to admin vs public Remix apps (by referer).
map $http_referer$request_uri $build_backend {
    default                                 "127.0.0.1:13002";
    "~*/admin/"                            "127.0.0.1:13001";
    "~*admin"                              "127.0.0.1:13001";
}

limit_req_zone $binary_remote_addr zone=td_auth:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tools.datawork.top;

    include /etc/nginx/snippets/tools-dashboard-routing.conf;
}

# HTTPS server block — certbot may merge or extend this after first install.
# If certificates are missing, install script omits this block until certbot runs.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tools.datawork.top;

    ssl_certificate /etc/letsencrypt/live/tools.datawork.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.datawork.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    include /etc/nginx/snippets/tools-dashboard-routing.conf;
}
