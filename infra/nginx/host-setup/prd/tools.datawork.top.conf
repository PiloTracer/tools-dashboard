# Host nginx — tools.datawork.top → Docker nginx-proxy on 127.0.0.1:8082
# TLS: install HTTP-only first, then: certbot --nginx -d tools.datawork.top ...
# Install: copy to /etc/nginx/conf.d/ (or sites-available + enable).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name tools.datawork.top;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # WebSocket long-lived connections (/ws/ on upstream)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
