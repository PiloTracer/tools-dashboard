# Included inside tools.datawork.top server blocks (host nginx).
# Upstream ports must match docker-compose.prd.yml TD_HOST_* publishes (127.0.0.1 only).

client_max_body_size 50M;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

# Gateway landing (public portal + admin chooser).
location = / {
    root /var/www/tools-dashboard-landing;
    try_files /index.html =404;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "public, max-age=300";
}

location /admin/build/ {
    proxy_pass http://127.0.0.1:13001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/build/.*\.map$ {
    set $proxy_upstream $build_backend;
    proxy_pass http://$proxy_upstream;
    proxy_intercept_errors on;
    error_page 404 = @map_fallback;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @map_fallback {
    return 204;
}

location = /favicon.ico {
    set $proxy_upstream $build_backend;
    proxy_pass http://$proxy_upstream;
    proxy_intercept_errors on;
    error_page 404 = @favicon_fallback;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @favicon_fallback {
    return 204;
}

location = /admin {
    return 301 /admin/;
}

location /admin/ {
    proxy_pass http://127.0.0.1:13001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /app/admin {
    return 301 /admin/;
}

location ^~ /app/admin/ {
    rewrite ^/app/admin/(.*)$ /admin/$1 permanent;
}

location = /app {
    if ($args = '') { return 301 /app/; }
    return 301 /app/?$args;
}

location /app/locales/ {
    rewrite ^/app/locales/(.*)$ /locales/$1 break;
    proxy_pass http://127.0.0.1:13002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /app/app-library-logos/ {
    rewrite ^/app/app-library-logos/(.*)$ /app-library-logos/$1 break;
    proxy_pass http://127.0.0.1:13002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /oauth/ {
    proxy_pass http://127.0.0.1:13002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /.well-known/ {
    proxy_pass http://127.0.0.1:13002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /app/ {
    proxy_pass http://127.0.0.1:13002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /build/ {
    set $proxy_upstream $build_backend;
    rewrite ^/build/(.*)$ /build/$1 break;
    proxy_pass http://$proxy_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/integrations/ {
    limit_req zone=td_auth burst=50 nodelay;
    proxy_pass http://127.0.0.1:18000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/app-library/ {
    limit_req zone=td_auth burst=50 nodelay;
    proxy_pass http://127.0.0.1:18000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/admin/app-library {
    limit_req zone=td_auth burst=50 nodelay;
    proxy_pass http://127.0.0.1:18000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    limit_req zone=td_auth burst=50 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /auth/ {
    limit_req zone=td_auth burst=30 nodelay;
    rewrite ^/auth/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /ws/ {
    rewrite ^/ws/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18010;
    proxy_http_version 1.1;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /storage/ {
    rewrite ^/storage/(.*)$ /buckets/$1 break;
    proxy_pass http://127.0.0.1:18888;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/appspecific/com.chrome.devtools.json {
    add_header Content-Type application/json;
    return 204;
}
