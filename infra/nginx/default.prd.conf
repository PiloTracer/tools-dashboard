# Production edge (Tools Dashboard) — https://tools.datawork.top
#
# TLS terminates at host nginx; this container listens on plain HTTP (127.0.0.1:8082 on the host).
# Host nginx must set X-Forwarded-Proto: https so upstream apps see HTTPS correctly.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

# Brute-force mitigation; tune rate/burst in production. WebSocket: long idle (see /ws/ location).
limit_req_zone $binary_remote_addr zone=td_auth:10m rate=10r/s;

# Set Strict-Transport-Security at the TLS terminator (or enable after nginx terminates TLS on :443).
map $http_referer$request_uri $build_backend {
    default                                 "front-public:3000";
    "~*/admin/"                            "front-admin:3000";
    "~*admin"                              "front-admin:3000";
}

server {
    listen 80;
    # Primary hostname; `_` allows direct access by IP during bring-up / health checks.
    server_name tools.datawork.top _;

    # Resolve Docker service names at request time (avoids stale IPs after container recreate).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $front_admin_upstream front-admin:3000;
    set $front_public_upstream front-public:3000;
    set $back_api_upstream back-api:8000;
    set $back_auth_upstream back-auth:8001;
    set $back_websockets_upstream back-websockets:8010;
    set $seaweedfs_upstream seaweedfs:8888;

    client_max_body_size 50M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gateway landing (public portal + admin chooser).
    # Use root+try_files — alias on "location = /" breaks some nginx builds.
    location = / {
        root /usr/share/nginx/html;
        try_files /landing/index.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }

    location /admin/build/ {
        proxy_pass http://$front_admin_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/build/.*\.map$ {
        set $proxy_upstream $build_backend;
        proxy_pass http://$proxy_upstream;
        proxy_intercept_errors on;
        error_page 404 = @map_fallback;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @map_fallback {
        return 204;
    }

    location = /favicon.ico {
        set $proxy_upstream $build_backend;
        proxy_pass http://$proxy_upstream;
        proxy_intercept_errors on;
        error_page 404 = @favicon_fallback;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @favicon_fallback {
        return 204;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://$front_admin_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /app/ is front-public only; admin UI is /admin/ (front-admin).
    location = /app/admin {
        return 301 /admin/;
    }

    location ^~ /app/admin/ {
        rewrite ^/app/admin/(.*)$ /admin/$1 permanent;
    }

    location = /app {
        if ($args = '') { return 301 /app/; }
        return 301 /app/?$args;
    }

    location /app/locales/ {
        rewrite ^/app/locales/(.*)$ /locales/$1 break;
        proxy_pass http://$front_public_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/app-library-logos/ {
        rewrite ^/app/app-library-logos/(.*)$ /app-library-logos/$1 break;
        proxy_pass http://$front_public_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://$front_public_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://$front_public_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://$front_public_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /build/ {
        set $proxy_upstream $build_backend;
        rewrite ^/build/(.*)$ /build/$1 break;
        proxy_pass http://$proxy_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # These back-api routers use a literal /api/... prefix. The generic /api/ block below strips /api/ and
    # would send wrong paths (e.g. /integrations/... instead of /api/integrations/...).
    location ^~ /api/integrations/ {
        limit_req zone=td_auth burst=50 nodelay;
        proxy_pass http://$back_api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/app-library/ {
        limit_req zone=td_auth burst=50 nodelay;
        proxy_pass http://$back_api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin/app-library {
        limit_req zone=td_auth burst=50 nodelay;
        proxy_pass http://$back_api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=td_auth burst=50 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$back_api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        limit_req zone=td_auth burst=30 nodelay;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://$back_auth_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass http://$back_websockets_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        rewrite ^/storage/(.*)$ /buckets/$1 break;
        proxy_pass http://$seaweedfs_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/appspecific/com.chrome.devtools.json {
        add_header Content-Type application/json;
        return 204;
    }
}
